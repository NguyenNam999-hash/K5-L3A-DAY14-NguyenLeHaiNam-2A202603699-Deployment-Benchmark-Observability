# Railway: deploy bằng Dockerfile, health check ở /health.
# Biến môi trường (AGENT_API_KEY, REDIS_URL, ...) đặt trên Railway dashboard / CLI,
# không ghi trong file này. PORT do Railway cấp, Dockerfile CMD đọc ${PORT}.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
